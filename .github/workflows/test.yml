name: Test

on:
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends             libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev             libffi-dev shared-mime-info
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run tests (non-admin)
        run: |
          USE_MOCK_DATA=true python -m pytest tests/             --ignore=tests/test_admin.py             -v --tb=short
      - name: Run admin tests
        run: |
          USE_MOCK_DATA=true python -m pytest tests/test_admin.py             -v --tb=short
      - name: Coverage report
        run: |
          USE_MOCK_DATA=true python -m pytest tests/             --cov=src --cov=web             --cov-report=term-missing             --cov-report=html:htmlcov             --tb=short -q             2>&1 | tail -30
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7
