name: CI/CD

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: 3.12
  NODE_VERSION: 20

jobs:
  grace-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: GRACE Lint
        run: |
          chmod +x scripts/grace-lint.sh
          ./scripts/grace-lint.sh --ci

  backend:
    needs: grace-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends             libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev             libffi-dev shared-mime-info
      - name: Install Python dependencies
        run: |
          pip install -e .[dev]
          pip install httpx
      - name: Prepare environment
        run: cp .env.example .env
      - name: Run backend tests (non-admin)
        run: |
          python -m pytest tests/             --ignore=tests/test_admin.py             -v --tb=short -q             --cov=src --cov=web             --cov-report=term-missing             --cov-report=html:htmlcov/backend             2>&1 | tail -50
      - name: Run admin tests
        run: |
          python -m pytest tests/test_admin.py             -v --tb=short -q             2>&1 | tail -20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: htmlcov/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (oxlint)
        run: npx oxlint src/
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Unit tests (vitest)
        run: npx vitest run --coverage 2>&1 | tail -30
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends             libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev             libffi-dev shared-mime-info
      - name: Install backend
        run: |
          cd ..
          pip install -e .[dev]
          pip install httpx uvicorn
      - name: Install frontend
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium 2>&1 | tail -5
      - name: Start backend server
        run: |
          cd ..
          cp .env.example .env
          USE_MOCK_DATA=true AUTH_ENABLED=false             python -m uvicorn web.app:app             --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 1
          done
      - name: Run E2E tests
        run: |
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:8000             npx playwright test 2>&1 | tail -30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: frontend/test-results/
          retention-days: 7
